<section class="hero-wrap">
  <div class="hero-tag">🌍 ESG Intelligence Platform</div>
  <div class="hero-title">Compare <span>ESG Trust</span><br>Scores Instantly</div>
  <div class="hero-sub">
    Search any two companies to compare their environmental, social
    and governance performance side by side.
  </div>
  <div class="hero-stats">
    <div class="stat-item"><div class="stat-num">{{ companyCount }}</div><div class="stat-lbl">Companies</div></div>
    <div class="stat-item"><div class="stat-num">{{ sectorCount }}</div><div class="stat-lbl">Sectors</div></div>
    <div class="stat-item"><div class="stat-num">{{ dataPoints }}</div><div class="stat-lbl">Data Points</div></div>
    <div class="stat-item"><div class="stat-num">{{ modelAccuracy }}</div><div class="stat-lbl">Model Accuracy</div></div>
  </div>
</section>
